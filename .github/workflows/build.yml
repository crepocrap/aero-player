name: Build Aero Player APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJ=." >> $GITHUB_ENV
          else
            mkdir -p _work
            unzip -q -o AeroPlayer.zip -d _work
            echo "PROJ=$(dirname "$(find _work -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV
          fi

      - name: Build release APK (fast)
        id: rel
        continue-on-error: true
        run: cd "$PROJ" && gradle assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (fallback if release failed)
        if: steps.rel.outcome == 'failure'
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AeroPlayer-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/**/*.apk
